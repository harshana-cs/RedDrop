<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RedDrop | Login</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- ICONS -->
  <link href="../../dist/output.css" rel="stylesheet">

  <!-- Google Login -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "hlb-red": "#B91C1C",
            "hlb-bg": "#FFF5F5",
            "hlb-lightRed": "#FEE2E2",
            "hlb-darkRed": "#991B1B",
          },
        },
      },
    }
  </script>

  <style>
    .input { @apply w-full border px-3 py-2 rounded-md focus:ring-red-500 focus:border-red-500; }
    .signupRole input:checked + span { @apply text-red-600 font-semibold; }
  </style>
</head>

<body class="min-h-screen bg-hlb-bg text-gray-800 font-sans flex items-center justify-center p-6">

<div class="w-full max-w-4xl bg-white shadow-xl rounded-2xl overflow-hidden grid md:grid-cols-2">

  <!-- LEFT PANEL -->
  <div class="bg-red-600 text-white p-10 flex flex-col justify-between">
    <div>
      <h1 class="text-4xl font-bold">RedDrop</h1>
      <p class="mt-4 text-lg opacity-90">Manage blood donations & requests efficiently.</p>
    </div>

    <div class="space-y-4 mt-10">
      <div class="flex items-center space-x-3"><i class="ri-shield-check-line text-2xl"></i><p>Secure & Private</p></div>
      <div class="flex items-center space-x-3"><i class="ri-time-line text-2xl"></i><p>24/7 Access</p></div>
      <div class="flex items-center space-x-3"><i class="ri-team-line text-2xl"></i><p>Community Driven</p></div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="p-10">

    <!-- LOGIN SECTION -->
    <div id="loginSection" class="space-y-8">
      <h2 class="text-3xl font-semibold text-gray-900">Welcome Back</h2>
      <p class="text-gray-600">Sign in to access your account</p>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="space-y-6">
        <div>
          <label class="text-sm text-gray-700">Email Address</label>
          <input id="loginEmail" type="email" placeholder="you@example.com" class="input" required>
        </div>

        <div>
          <label class="text-sm text-gray-700">Password</label>
          <input id="loginPassword" type="password" placeholder="Enter password" class="input" required>
        </div>

        <button type="submit" class="w-full bg-red-600 text-white py-3 rounded-xl font-medium hover:bg-red-700">
          Sign In
        </button>
      </form>

      <!-- GOOGLE LOGIN BUTTON -->
      <div class="mt-4">
        <div id="g_id_onload"
          data-client_id="320231613519-n8ppnf9bof8r6js60el89rar1mvtl8lo.apps.googleusercontent.com"
          data-callback="handleGoogleLogin"
          data-auto_prompt="false">
        </div>

        <div class="g_id_signin" data-type="standard" data-size="large"></div>
      </div>

      <p class="text-center text-sm mt-4">
        Don't have an account?
        <button type="button" onclick="toggleForm('signup')" class="text-red-600 font-medium hover:underline">Sign up here</button>
      </p>
    </div>

    <!-- SIGNUP SECTION -->
    <div id="signupSection" class="hidden space-y-8">
      <h2 class="text-3xl font-semibold text-gray-900">Create Account</h2>

      <!-- ROLE SELECTION -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Select Role</label>
        <div class="grid grid-cols-2 gap-3">
          <label class="signupRole flex items-center space-x-2 p-3 border rounded-xl cursor-pointer">
            <input type="radio" name="role" value="patient" checked>
            <span>Patient/User</span>
          </label>

          <label class="signupRole flex items-center space-x-2 p-3 border rounded-xl cursor-pointer">
            <input type="radio" name="role" value="donor">
            <span>Blood Donor</span>
          </label>
        </div>
      </div>

      <!-- SIGNUP FORM -->
      <form id="signupForm" class="space-y-5">
        <input id="fullname" type="text" placeholder="Full Name" class="input" required>
        <input id="emailaddress" type="email" placeholder="Email Address" class="input" required>
        <input id="phonenumber" type="tel" placeholder="Phone Number" class="input" required>
        <input id="password" type="password" placeholder="Password" class="input" required>
        <input id="confirmpassword" type="password" placeholder="Confirm Password" class="input" required>

        <label class="flex items-center"><input type="checkbox" class="mr-2" required> I agree to Terms</label>

        <button type="submit" class="w-full bg-red-600 text-white py-3 rounded-xl font-medium hover:bg-red-700">
          Create Account
        </button>
      </form>

      <!-- GOOGLE SIGNUP -->
      <div class="mt-4">
        <div class="g_id_signin" data-size="large"></div>
      </div>

      <p class="text-center text-sm mt-4">
        Already have an account?
        <button type="button" onclick="toggleForm('login')" class="text-red-600 font-medium hover:underline">Login here</button>
      </p>
    </div>

  </div>
</div>

<!-- PRIORITY MODAL -->
<div id="priorityModal" class="fixed inset-0 bg-black bg-opacity-40 hidden items-center justify-center z-50">
  <div class="bg-white w-11/12 max-w-md rounded-xl p-6 shadow-xl text-center">
    <h2 class="text-2xl font-semibold text-gray-900">
      Need Blood Urgently?
    </h2>

    <p class="text-gray-600 mt-2">
      If this is an emergency, you can request blood immediately.
    </p>

    <div class="mt-6 space-y-4">
      <button id="urgentBtn"
              class="w-full bg-red-600 text-white py-3 rounded-lg text-lg font-medium hover:bg-red-700">
        Request Blood
      </button>

      <button id="skipBtn"
              class="w-full border border-gray-300 py-3 rounded-lg text-lg font-medium hover:bg-gray-100">
        Skip to Dashboard
      </button>
    </div>
  </div>
</div>

<!-- JAVASCRIPT -->
<script>
function toggleForm(form) {
  document.getElementById("loginSection").classList.toggle("hidden", form === "signup");
  document.getElementById("signupSection").classList.toggle("hidden", form === "login");
}

function getSelectedRoleSignup() {
  return document.querySelector("input[name='role']:checked")?.value || "patient";
}

async function refreshToken() {
    const refresh = localStorage.getItem("refresh");
    if (!refresh) return;

    const res = await fetch("http://127.0.0.1:8000/api/token/refresh/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ refresh })
    });

    const data = await res.json();
    if (data.access) {
        localStorage.setItem("access", data.access);
    } else {
        alert("Session expired, please login again.");
        window.location.href = "/";
    }
}

/* GOOGLE LOGIN HANDLER */
window.handleGoogleLogin = async (response) => {
    console.log("Google credential:", response.credential);

    const isLogin = !document.getElementById("loginSection").classList.contains("hidden");
    const signup_role = getSelectedRoleSignup();

    try {
        if (isLogin) {
            // LOGIN
            const res = await fetch("http://localhost:8000/loginsignup/google_login/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ credential: response.credential })
            });

            const data = await res.json();
            console.log("Login:", data);

            if (data.success) {
                localStorage.setItem("user_type", data.user_type);
                localStorage.setItem("emailaddress", data.email || data.emailaddress);
                localStorage.setItem("access_token", data.tokens.access);
                localStorage.setItem("refresh_token", data.tokens.refresh);
                localStorage.setItem("fullname", data.fullname);

                if (data.user_type === "donor") {
                    if (!data.profile_complete) {
                        window.location.href = "donor_register.html";
                    } else {
                        window.location.href = "donor.html";
                    }
                } else {
                    // patient
                    alert(`Welcome ${data.fullname}!`);
                    showPriorityModal();
                }
            } else {
                alert(data.message || "Login failed");
            }

        } else {
            // SIGNUP
            const res = await fetch("http://localhost:8000/loginsignup/google_signup/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    credential: response.credential,
                    user_type: signup_role
                })
            });

            const data = await res.json();
            console.log("Signup:", data);

            if (!data.success) return alert(data.message);

            const code = prompt("Enter verification code sent to email:");
            if (!code) return;

            const verifyRes = await fetch("http://localhost:8000/loginsignup/verify-code/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: data.email, code })
            });

            const verifyData = await verifyRes.json();
            if (verifyData.success) {
                alert("Verification successful! Please login.");
                toggleForm("login");
            } else {
                alert("Invalid verification code.");
            }
        }

    } catch (err) {
        console.error(err);
        alert("Unexpected error occurred.");
    }
};

// MANUAL SIGNUP
document.getElementById("signupForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const signup_role = getSelectedRoleSignup();

    const payload = {
        fullname: document.getElementById("fullname").value,
        emailaddress: document.getElementById("emailaddress").value,
        phonenumber: document.getElementById("phonenumber").value,
        password: document.getElementById("password").value,
        confirmpassword: document.getElementById("confirmpassword").value,
        role: signup_role
    };

    const res = await fetch("http://localhost:8000/patient/signup/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    });

    const data = await res.json();
    alert(data.message);

   if (data.success) {

    localStorage.setItem("emailaddress", data.emailaddress);
    localStorage.setItem("user_type", data.user_type);
    localStorage.setItem("fullname", data.fullname);

    if (data.user_type === "donor") {

        if (!data.profile_complete) {
            // donor exists but registration not completed
            window.location.href = "donor_register.html";
        } else {
            // donor fully registered
            window.location.href = "donor_dashboard.html";
        }

    } else {
        // patient
        alert(`Welcome ${data.fullname}!`);
        showPriorityModal();
    }

} else {
    alert(data.message);
}

});

function showPriorityModal() {
    console.log("Showing priority modal");
    const modal = document.getElementById("priorityModal");
    
    // Remove hidden and add flex to make it visible
    modal.classList.remove("hidden");
    modal.classList.add("flex");

    document.getElementById("urgentBtn").onclick = () => {
        const role = localStorage.getItem("user_type");
        if (role === "patient") {
            localStorage.setItem("showRequestSection", "true");
            window.location.href = "blood_request.html#requestBlood";
        } else {
            alert("Only patients can request blood.");
        }
    };

    document.getElementById("skipBtn").onclick = () => {
        window.location.href = "blood_request.html";
    };
}

/* ---- MANUAL LOGIN ---- */
const loginForm = document.getElementById("loginForm");
loginForm?.addEventListener("submit", async (e) => {
    e.preventDefault();

    const emailaddress = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;

    try {
        const res = await fetch("http://localhost:8000/loginsignup/patient/login/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ emailaddress, password })
        });

        const data = await res.json();
        if (data.success) {
            localStorage.setItem("emailaddress", data.emailaddress);
            localStorage.setItem("user_type", "patient");
            localStorage.setItem("fullname", data.fullname);
            
            alert(`Welcome ${data.fullname}!`);
            showPriorityModal();
        } else {
            alert(data.message);
        }
    } catch (err) {
        console.error("Login error:", err);
        alert("Login failed: " + err.message);
    }
});
</script>

</body>
</html>
