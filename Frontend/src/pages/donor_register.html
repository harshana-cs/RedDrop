<!-- PERSONAL -->

<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div>
        <label>First Name *</label>

    </div>

    <div>
        <label>Gender *</label>
        <select name="gender" required class="w-full border rounded px-3 py-2">

            <option>Male</option>
            <option>Female</option>
            <option>Other</option>

    </div>

    <div>
        <label>Blood Type *</label>
        <select name="blood_type" required class="w-full border rounded px-3 py-2">
            <option value="">Select</option>
            <option>A+</option><option>A-</option>
            <option>B+</option><option>B-</option>
            <option>O+</option><option>O-</option>
            <option>AB+</option><option>AB-</option>

    </div>

    <div class="md:col-span-2">
        <label>Street Address *</label>

    </div>

    <div>

    </div>

    <div>

    </div>

        <button id="continueBtn"
        class="px-6 py-2 bg-red-600 text-white rounded">
    Continue
</button>


    </div>

<script>

/******** IMAGE PREVIEW *********/
function preview(input, img){
  input.addEventListener("change",()=>{
      const f=input.files[0];
      if(!f) return img.classList.add("hidden");
      const r=new FileReader();
      r.onload=e=>{img.src=e.target.result;img.classList.remove("hidden")}
      r.readAsDataURL(f);
  })
}
preview(citizenship,citizenshipPreview);
preview(photo,photoPreview);


/******** PREFILL LOGGED IN USER *********/
window.addEventListener("DOMContentLoaded", () => {
    const fullname = localStorage.getItem("fullname");
    const email = localStorage.getItem("emailaddress");

    if (fullname) {
        const parts = fullname.split(" ");
        document.querySelector("input[name='first_name']").value = parts[0] || "";
        document.querySelector("input[name='last_name']").value  = parts.slice(1).join(" ") || "";
    }

    if (email) {
        document.querySelector("input[name='email']").value = email;
        document.querySelector("input[name='email']").readOnly = true;
    }
});


/******** SUBMIT *********/
document.getElementById("donorForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    // validation
    let age = new Date().getFullYear() - new Date(dob.value).getFullYear();
    if(age < 18){
        alert("Must be 18+ to donate");
        return;
    }

    if(weight.value < 50){
        alert("Minimum 50kg required");
        return;
    }

    const formData = new FormData(e.target);

    try {
        const res = await fetch("http://localhost:8000/donor/register/", {
            method: "POST",
            credentials: "include",
            body: formData
        });

        if(!res.ok){
            alert("Server Error " + res.status);
            return;
        }

        const data = await res.json();

        if (data.success) {

    // Update success modal text dynamically
    document.querySelector("#successModal h2").innerText = "Registration Completed!";
    document.querySelector("#successModal p").innerText =
        "Please wait up to 5 minutes while the system approves your request. We will notify you via email once approval is completed.";

    successModal.classList.remove("hidden");
    e.target.reset();

    document.getElementById("continueBtn").onclick = () => {
    window.location.href = "donor.html";
};

}
 else {
            alert(data.message || "Registration Failed");
        }

    } catch (err) {
        console.error(err);
        alert("Something went wrong");
    }
});
</script>
