<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donor Registration</title>

<link href="../../dist/output.css" rel="stylesheet">

<style>
.bg-hlb-bg{background:#FFF5F5;}
.sidebar-fixed{position:fixed;inset:0 auto 0 0;width:16rem;background:#fff;
border-right:1px solid #e5e7eb;z-index:1000}
.preview-img{max-width:150px;border-radius:8px;border:1px solid #ddd;margin-top:6px}
.modal-top{z-index:9999!important;}
</style>
</head>

<body class="bg-hlb-bg text-gray-800">

<!-- ================= Sidebar ================= -->
<div class="sidebar-fixed flex flex-col bg-white border-r">
    <!-- Logo -->
    <div class="flex items-center justify-center h-16 border-b border-gray-200">
        <div class="flex items-center space-x-2">
            <div class="h-10 w-10 bg-red-100 rounded-lg flex items-center justify-center">
                <i class="fas fa-heart text-red-600"></i>
            </div>
            <h1 class="font-bold text-gray-900 text-xl">RedDrop</h1>
        </div>
    </div>
</div>

<!-- Mobile Header -->
<div class="md:hidden bg-white border-b border-gray-200 p-4 flex items-center justify-between">
    <div class="flex items-center space-x-3">
        <button id="mobileMenuBtn">
            <i class="fas fa-bars text-gray-700 text-xl"></i>
        </button>

        <div class="flex items-center space-x-2">
            <div class="h-8 w-8 bg-red-100 rounded-lg flex items-center justify-center">
                <i class="fas fa-heart text-red-600"></i>
            </div>
            <h1 class="font-bold text-gray-900">BloodBridge</h1>
        </div>
    </div>

    <div class="flex items-center space-x-3">
        <div class="h-8 w-8 bg-gray-200 rounded-full flex items-center justify-center text-gray-700 font-medium text-sm">
            JD
        </div>
    </div>
</div>

<!-- =============== MAIN CONTENT =============== -->
<div class="ml-64 p-6">

    <!-- Header -->
    <div class="bg-white rounded-lg shadow-sm border p-5 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold">Donor Registration</h1>
            <p class="text-gray-600">Join our life-saving community</p>
        </div>

        <div class="flex items-center gap-3">
            <span class="text-gray-600">Welcome, Donor!</span>
            <div class="w-10 h-10 bg-red-100 text-red-700 rounded-full flex items-center justify-center">
                👤
            </div>
        </div>
    </div>

    <!-- FORM CARD -->
    <div class="mt-6 bg-white rounded-lg shadow-sm border p-6">

<div id="donorFormContainer">

<!-- PERSONAL -->
<h2 class="text-lg font-semibold mb-4 border-b pb-2">Personal Information</h2>

<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div>
        <label>First Name *</label>
        <input name="first_name" required class="w-full border rounded px-3 py-2">
    </div>

    <div>
        <label>Last Name *</label>
        <input name="last_name" required class="w-full border rounded px-3 py-2">
    </div>

    <div>
        <label>Email *</label>
        <input type="email" name="email" required class="w-full border rounded px-3 py-2">
    </div>

    <div>
        <label>Phone *</label>
        <input type="tel" name="phone_number" required class="w-full border rounded px-3 py-2">
    </div>

    <div>
        <label>Date of Birth *</label>
        <input type="date" name="date_of_birth" id="dob" required class="w-full border rounded px-3 py-2">
    </div>

    <div>
        <label>Gender *</label>
        <select name="gender" required class="w-full border rounded px-3 py-2">
            <option value="">Select</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>
    </div>

    <div>
        <label>Blood Type *</label>
        <select name="blood_type" required class="w-full border rounded px-3 py-2">
            <option value="">Select</option>
            <option>A+</option><option>A-</option>
            <option>B+</option><option>B-</option>
            <option>O+</option><option>O-</option>
            <option>AB+</option><option>AB-</option>
        </select>
    </div>

    <div class="md:col-span-2">
        <label>Street Address *</label>
        <input name="address" required class="w-full border rounded px-3 py-2">
    </div>

    <div>
        <label>District *</label>
        <input name="district" required class="w-full border rounded px-3 py-2">
    </div>

    <div>
        <label>State *</label>
        <input name="state" required class="w-full border rounded px-3 py-2">
    </div>

    <div>
        <label>Zip Code *</label>
        <input name="zip_code" required class="w-full border rounded px-3 py-2">
    </div>
</div>

<!-- EMERGENCY -->
<h2 class="text-lg font-semibold mt-8 mb-4 border-b pb-2">Emergency Contact</h2>

<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div>
        <label>Contact Name *</label>
        <input name="emergency_contact_name" required class="w-full border rounded px-3 py-2">
    </div>

    <div>
        <label>Contact Phone *</label>
        <input name="emergency_contact_phone" required class="w-full border rounded px-3 py-2">
    </div>
</div>

<!-- MEDICAL -->
<h2 class="text-lg font-semibold mt-8 mb-4 border-b pb-2">Medical Information</h2>

<div>
    <label>Weight (KG) *</label>
    <input type="number" name="weight" id="weight" required class="w-40 border rounded px-3 py-2">
</div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
    <label class="flex items-center gap-2 border p-3 rounded">
        <input type="checkbox" name="has_diabetes">
        Diabetes
    </label>

    <label class="flex items-center gap-2 border p-3 rounded">
        <input type="checkbox" name="has_hypertension">
        Hypertension
    </label>

    <label class="flex items-center gap-2 border p-3 rounded">
        <input type="checkbox" name="has_heart_disease">
        Heart Disease
    </label>

    <label class="flex items-center gap-2 border p-3 rounded">
        <input type="checkbox" name="no_medical_conditions">
        No Medical Conditions
    </label>
</div>

<!-- FILE UPLOAD -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8">
    <div>
        <label>Upload Citizenship *</label>
        <input type="file" name="citizenship_id" id="citizenship" required>
        <img id="citizenshipPreview" class="preview-img hidden">
    </div>

    <div>
        <label>Upload Photo *</label>
        <input type="file" name="photo" id="photo" required>
        <img id="photoPreview" class="preview-img hidden">
    </div>
</div>

<!-- CONSENT -->
<div class="mt-6">
<div class="mt-4 p-4 bg-red-100 rounded">
    <label class="flex items-center gap-2">
        <input type="checkbox" name="consent_notifications">
        Receive Notifications
    </label>
</div>

<div class="mt-4 p-4 bg-red-100 rounded">
    <label class="flex items-center gap-2">
        <input type="checkbox" name="accepted_terms" id="terms" required>
        I agree to terms & conditions *
    </label>
</div>
</div>

<!-- BUTTONS -->
<div class="mt-6 flex justify-end gap-4 border-t pt-4">
    <button type="button" onclick="return false;" class="px-6 py-2 border rounded">
        Cancel
    </button>

    <button type="button" id="registerBtn" onclick="return false;"
        class="px-6 py-2 bg-red-600 text-white rounded hover:bg-red-700">
        Register
    </button>
</div>

</div><!-- End donorFormContainer -->

</div>
</div>

<!-- APPROVAL WAITING MODAL -->
<div id="approvalWaiting"
     class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">

  <div class="bg-white rounded-lg p-6 text-center w-80">
    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-red-600 mx-auto mb-4"></div>

    <h2 class="text-lg font-semibold mb-2">Waiting for Approval</h2>
    <p class="text-sm text-gray-600 mb-4">
      Please wait while an admin reviews your request.
    </p>

    <button id="cancelWaitingBtn"
            class="mt-2 px-4 py-2 border border-gray-300 rounded hover:bg-gray-100 text-sm">
      Cancel
    </button>
  </div>
</div>


<script>
/* ================= IMAGE PREVIEW ================= */
function preview(input, img) {
    input.addEventListener("change", () => {
        const f = input.files[0];
        if (!f) { img.classList.add("hidden"); return; }
        const r = new FileReader();
        r.onload = e => { img.src = e.target.result; img.classList.remove("hidden"); };
        r.readAsDataURL(f);
    });
}

preview(citizenship, citizenshipPreview);
preview(photo, photoPreview);


/* ================= GLOBAL STATE ================= */
let approvalInterval = null;
let redirectTimeout  = null;
let isSubmitting     = false;


/* ================= VALIDATION HELPERS ================= */

function showError(el, msg) {
    el.classList.add("border-red-500", "bg-red-50");
    el.classList.remove("border-gray-300");
    removeError(el);                          // clear any previous
    const p = document.createElement("p");
    p.className = "val-err text-xs text-red-600 mt-1 flex items-center gap-1";
    p.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>${msg}`;
    el.parentElement.appendChild(p);
}

function removeError(el) {
    el.classList.remove("border-red-500", "bg-red-50");
    el.parentElement.querySelector(".val-err")?.remove();
}

function showFileError(inputEl, msg) {
    inputEl.parentElement.querySelector(".val-err")?.remove();
    if (!msg) return;
    const p = document.createElement("p");
    p.className = "val-err text-xs text-red-600 mt-1 flex items-center gap-1";
    p.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>${msg}`;
    inputEl.parentElement.appendChild(p);
}

function showCheckboxError(checkboxEl, msg) {
    checkboxEl.closest(".mt-4")?.querySelector(".val-err")?.remove();
    if (!msg) return;
    const p = document.createElement("p");
    p.className = "val-err text-xs text-red-600 mt-1";
    p.textContent = msg;
    checkboxEl.closest(".mt-4")?.appendChild(p);
}

// Live-clear on input/change
function attachLiveValidation() {
    document.querySelectorAll("#donorFormContainer input:not([type=checkbox]):not([type=file]), #donorFormContainer select")
        .forEach(el => {
            el.addEventListener("input",  () => removeError(el));
            el.addEventListener("change", () => removeError(el));
        });

    document.getElementById("citizenship").addEventListener("change", () =>
        showFileError(document.getElementById("citizenship"), null));
    document.getElementById("photo").addEventListener("change", () =>
        showFileError(document.getElementById("photo"), null));

    document.getElementById("terms").addEventListener("change", () =>
        showCheckboxError(document.getElementById("terms"), null));
}


/* ================= MAIN VALIDATE ================= */
function validateDonorForm() {
    let valid = true;

    const val  = id => document.querySelector(`[name="${id}"]`);
    const valId = id => document.getElementById(id);

    // ── Helpers ──
    const req = (el, msg) => {
        if (!el.value.trim()) { showError(el, msg); valid = false; return false; }
        removeError(el); return true;
    };
    const regex = (el, re, msg) => {
        if (!re.test(el.value.trim())) { showError(el, msg); valid = false; return false; }
        removeError(el); return true;
    };

    // ── 1. First Name ──
    const firstName = val("first_name");
    if (req(firstName, "First name is required.")) {
        regex(firstName, /^[A-Za-z\s'.]{2,}$/, "Enter a valid first name (letters only).");
    }

    // ── 2. Last Name ──
    const lastName = val("last_name");
    if (req(lastName, "Last name is required.")) {
        regex(lastName, /^[A-Za-z\s'.]{1,}$/, "Enter a valid last name (letters only).");
    }

    // ── 3. Email ──
    const email = val("email");
    if (req(email, "Email is required.")) {
        regex(email, /^[^\s@]+@[^\s@]+\.[^\s@]+$/, "Enter a valid email address.");
    }

    // ── 4. Phone — Nepal mobile (97/98 + 8 digits) ──
    const phone = val("phone_number");
    if (req(phone, "Phone number is required.")) {
        regex(phone, /^(97|98)\d{8}$/, "Enter a valid 10-digit Nepal mobile number (starts with 97 or 98).");
    }

    // ── 5. Date of Birth ──
    const dobEl = valId("dob");
    if (!dobEl.value) {
        showError(dobEl, "Date of birth is required.");
        valid = false;
    } else {
        const dob     = new Date(dobEl.value);
        const today   = new Date();
        const ageDiff = today.getFullYear() - dob.getFullYear();
        const had18   = today >= new Date(dob.getFullYear() + 18, dob.getMonth(), dob.getDate());
        const age     = had18 ? ageDiff : ageDiff - 1;

        if (dob >= today) {
            showError(dobEl, "Date of birth must be in the past.");
            valid = false;
        } else if (age < 18) {
            showError(dobEl, "You must be at least 18 years old to donate.");
            valid = false;
        } else if (age > 65) {
            showError(dobEl, "Donors must be 65 years old or younger.");
            valid = false;
        } else {
            removeError(dobEl);
        }
    }

    // ── 6. Gender ──
    const gender = val("gender");
    if (!gender.value) { showError(gender, "Please select a gender."); valid = false; }
    else removeError(gender);

    // ── 7. Blood Type ──
    const bloodType = val("blood_type");
    if (!bloodType.value) { showError(bloodType, "Please select a blood type."); valid = false; }
    else removeError(bloodType);

    // ── 8. Address ──
    const address = val("address");
    if (req(address, "Street address is required.")) {
        if (address.value.trim().length < 5) {
            showError(address, "Please enter a complete address.");
            valid = false;
        }
    }

    // ── 9. District ──
    req(val("district"), "District is required.");

    // ── 10. State ──
    req(val("state"), "State / Province is required.");

    // ── 11. Zip Code ──
    const zip = val("zip_code");
    if (req(zip, "Zip code is required.")) {
        regex(zip, /^\d{5}$/, "Enter a valid 5-digit zip code.");
    }

    // ── 12. Emergency Contact Name ──
    const ecName = val("emergency_contact_name");
    if (req(ecName, "Emergency contact name is required.")) {
        regex(ecName, /^[A-Za-z\s'.]{2,}$/, "Enter a valid name (letters only).");
    }

    // ── 13. Emergency Contact Phone ──
    const ecPhone = val("emergency_contact_phone");
    if (req(ecPhone, "Emergency contact phone is required.")) {
        regex(ecPhone, /^(97|98)\d{8}$/, "Enter a valid 10-digit Nepal mobile number.");
    }

    // ── 14. Weight (min 50 kg) ──
    const weightEl = valId("weight");
    const wVal = parseInt(weightEl.value);
    if (!weightEl.value) {
        showError(weightEl, "Weight is required.");
        valid = false;
    } else if (isNaN(wVal) || wVal < 50) {
        showError(weightEl, "Minimum weight is 50 kg to donate.");
        valid = false;
    } else if (wVal > 200) {
        showError(weightEl, "Please enter a realistic weight (max 200 kg).");
        valid = false;
    } else {
        removeError(weightEl);
    }

    // ── 15. Citizenship file ──
    const citizenshipEl = valId("citizenship");
    const cidFile = citizenshipEl.files[0];
    if (!cidFile) {
        showFileError(citizenshipEl, "Please upload your citizenship document.");
        valid = false;
    } else if (cidFile.size > 5 * 1024 * 1024) {
        showFileError(citizenshipEl, "File exceeds 5 MB limit.");
        valid = false;
    } else {
        showFileError(citizenshipEl, null);
    }

    // ── 16. Photo file ──
    const photoEl = valId("photo");
    const photoFile = photoEl.files[0];
    if (!photoFile) {
        showFileError(photoEl, "Please upload your photo.");
        valid = false;
    } else if (photoFile.size > 5 * 1024 * 1024) {
        showFileError(photoEl, "File exceeds 5 MB limit.");
        valid = false;
    } else {
        showFileError(photoEl, null);
    }

    // ── 17. Terms checkbox ──
    const termsEl = valId("terms");
    if (!termsEl.checked) {
        showCheckboxError(termsEl, "You must agree to the terms & conditions.");
        valid = false;
    } else {
        showCheckboxError(termsEl, null);
    }

    return valid;
}


/* ================= PREFILL USER ================= */
window.addEventListener("DOMContentLoaded", () => {
    getDonorLocation();
    attachLiveValidation();

    const fullname = localStorage.getItem("fullname");
    const email    = localStorage.getItem("emailaddress");

    if (fullname) {
        const parts = fullname.split(" ");
        document.querySelector("input[name='first_name']").value = parts[0] || "";
        document.querySelector("input[name='last_name']").value  = parts.slice(1).join(" ") || "";
    }

    if (email) {
        const emailInput = document.querySelector("input[name='email']");
        emailInput.value    = email;
        emailInput.readOnly = true;
    }

    if (sessionStorage.getItem("donor_waiting") === "true") {
        showWaitingPopup();
        startApprovalCheck();
    }
});

function getDonorLocation() {
    return new Promise((resolve) => {
        if (!navigator.geolocation) { resolve(null); return; }
        navigator.geolocation.getCurrentPosition(
            pos => resolve({ latitude: pos.coords.latitude, longitude: pos.coords.longitude }),
            ()  => { console.warn("Location not allowed"); resolve(null); },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    });
}


/* ================= REGISTER ================= */
document.getElementById("registerBtn").addEventListener("click", async (e) => {
    e.preventDefault();
    if (isSubmitting) return;

    // Run validation — stop if any field fails
    if (!validateDonorForm()) {
        const firstErr = document.querySelector(".val-err");
        firstErr?.scrollIntoView({ behavior: "smooth", block: "center" });
        return;
    }

    isSubmitting = true;

    const formData = new FormData();
    const location = await getDonorLocation();
    if (location) {
        formData.append("latitude",  location.latitude);
        formData.append("longitude", location.longitude);
    }

    document.querySelectorAll("#donorFormContainer input, #donorFormContainer select")
        .forEach(el => {
            if (!el.name) return;
            if (el.type === "checkbox" && el.checked) {
                formData.append(el.name, "on");
            } else if (el.type === "file" && el.files[0]) {
                formData.append(el.name, el.files[0]);
            } else if (el.type !== "checkbox") {
                formData.append(el.name, el.value);
            }
        });

    sessionStorage.setItem("donor_waiting", "true");
    showWaitingPopup();
    startApprovalCheck();

    try {
        await fetch("http://localhost:8000/donor/register/", {
            method: "POST",
            headers: { "Authorization": `Bearer ${localStorage.getItem("access_token")}` },
            body: formData
        });
    } catch (err) {
        console.warn("Submission interrupted", err);
        isSubmitting = false;
    }
});


/* ================= POPUP ================= */
function showWaitingPopup() {
    const modal = document.getElementById("approvalWaiting");
    modal.classList.remove("hidden");
    modal.style.display = "flex";
    redirectTimeout = setTimeout(goToDashboard, 5000);
}


/* ================= CANCEL ================= */
document.getElementById("cancelWaitingBtn").addEventListener("click", () => {
    clearTimeout(redirectTimeout);
    sessionStorage.removeItem("donor_waiting");
    goToDashboard();
});


/* ================= DASHBOARD ================= */
function goToDashboard() {
    clearInterval(approvalInterval);
    window.location.href = "index.html";
}


/* ================= APPROVAL POLLING ================= */
function startApprovalCheck() {
    if (approvalInterval) return;
    const email = document.querySelector("input[name='email']").value;

    approvalInterval = setInterval(async () => {
        try {
            const res = await fetch("http://localhost:8000/donor/check-approval/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email })
            });
            if (!res.ok) return;
            const data = await res.json();
            if (data.approved || data.already_approved) {
                clearInterval(approvalInterval);
                clearTimeout(redirectTimeout);
                sessionStorage.removeItem("donor_waiting");
                window.location.href = "index.html";
            }
        } catch (err) {
            console.error("Approval check failed", err);
        }
    }, 5000);
}
</script>
</body>
</html>
