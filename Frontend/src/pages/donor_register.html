<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donor Registration | BloodBridge</title>

<!-- Font Awesome 6 (free) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<!-- Google Fonts: Inter & Poppins for modern typography -->
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #FFF5F5 0%, #FFE8E8 100%);
    color: #1E1E2F;
    min-height: 100vh;
}

/* main container - full width, no sidebar */
.donor-main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
}

/* header card redesign with back button */
.header-card {
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(0px);
    border-radius: 28px;
    padding: 1.2rem 2rem;
    margin-bottom: 2rem;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
    border: 1px solid rgba(0, 0, 0, 0.05);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
    transition: all 0.2s ease;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 1rem;
}

.back-dashboard-btn {
    background: #F0F0F5;
    border: none;
    border-radius: 40px;
    padding: 0.5rem 1.2rem;
    font-size: 0.85rem;
    font-weight: 600;
    color: #4B4B5C;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Inter', sans-serif;
}

.back-dashboard-btn:hover {
    background: #E4E4EC;
    color: #2C2C3A;
    transform: translateX(-2px);
}

.header-left h1 {
    font-family: 'Poppins', sans-serif;
    font-size: 1.9rem;
    font-weight: 700;
    background: linear-gradient(135deg, #C41E3A, #A5152F);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    letter-spacing: -0.3px;
}

.header-left p {
    color: #5B5B6E;
    margin-top: 0.3rem;
    font-size: 0.95rem;
    font-weight: 500;
}

.donor-badge {
    display: flex;
    align-items: center;
    gap: 1rem;
    background: #FFF0F0;
    padding: 0.6rem 1.4rem;
    border-radius: 60px;
    border: 1px solid #FFD4D4;
}

.donor-badge span {
    font-weight: 600;
    color: #B91C2C;
}

.avatar-icon {
    width: 44px;
    height: 44px;
    background: linear-gradient(145deg, #FFE0E0, #FFCECE);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}

/* main form card */
.form-card {
    background: #FFFFFF;
    border-radius: 32px;
    box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0, 0, 0, 0.02);
    border: 1px solid #F0EFF2;
    overflow: hidden;
    transition: transform 0.2s;
}

.form-inner {
    padding: 2rem 2rem 2rem 2rem;
}

/* section headers with modern flair */
.section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 1.8rem;
    margin-top: 1rem;
    border-bottom: 2px solid #F0EFF2;
    padding-bottom: 0.75rem;
}

.section-header:first-of-type {
    margin-top: 0;
}

.section-icon {
    width: 36px;
    height: 36px;
    background: #FFF1F1;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #C41E3A;
    font-size: 1.1rem;
}

.section-header h2 {
    font-size: 1.45rem;
    font-weight: 600;
    color: #1A1A2E;
    letter-spacing: -0.2px;
}

/* grid layout */
.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1.5rem;
}

.full-width {
    grid-column: span 2;
}

@media (max-width: 768px) {
    .form-grid {
        grid-template-columns: 1fr;
        gap: 1.25rem;
    }
    .full-width {
        grid-column: span 1;
    }
    .form-inner {
        padding: 1.5rem;
    }
    .header-card {
        flex-direction: column;
        align-items: flex-start;
    }
    .header-left {
        flex-wrap: wrap;
    }
}

/* input styles */
.input-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.input-group label {
    font-size: 0.85rem;
    font-weight: 600;
    color: #2D2D3A;
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    gap: 5px;
}

.required-star {
    color: #E53E3E;
    font-size: 0.9rem;
}

.input-group input, 
.input-group select {
    border: 1.5px solid #E9E9EF;
    border-radius: 16px;
    padding: 12px 16px;
    font-size: 0.95rem;
    transition: all 0.2s ease;
    background: #FEFEFE;
    font-family: 'Inter', sans-serif;
}

.input-group input:focus, 
.input-group select:focus {
    outline: none;
    border-color: #C41E3A;
    box-shadow: 0 0 0 3px rgba(196, 30, 58, 0.1);
}

/* medical conditions grid */
.conditions-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 0.9rem;
    margin-top: 0.5rem;
}

.condition-check {
    background: #FAFAFE;
    border: 1.5px solid #E9E9EF;
    border-radius: 60px;
    padding: 0.5rem 1.2rem;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.9rem;
    font-weight: 500;
}

.condition-check:hover {
    background: #FFF2F2;
    border-color: #F0B3B3;
}

.condition-check input {
    width: 18px;
    height: 18px;
    accent-color: #C41E3A;
    margin: 0;
}

/* file upload modern */
.file-zone {
    border: 2px dashed #E0DEE8;
    border-radius: 20px;
    padding: 1rem 1rem 0.8rem 1rem;
    background: #FCFCFD;
    transition: all 0.2s;
    cursor: pointer;
}

.file-zone:hover {
    border-color: #C41E3A;
    background: #FFF9F9;
}

.file-label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 500;
    color: #2D2D3A;
}

.preview-img {
    margin-top: 12px;
    max-width: 110px;
    max-height: 110px;
    border-radius: 16px;
    border: 1px solid #EDEAF1;
    object-fit: cover;
}

/* consent blocks */
.consent-block {
    background: #FFF6F5;
    border-radius: 20px;
    padding: 1rem 1.4rem;
    margin-top: 1rem;
    border: 1px solid #FFE2DF;
    transition: 0.1s;
}

.consent-block label {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 500;
    color: #2C2C38;
    cursor: pointer;
}

.consent-block input {
    width: 20px;
    height: 20px;
    accent-color: #C41E3A;
}

/* buttons */
.action-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 1rem;
    margin-top: 2.5rem;
    border-top: 1.5px solid #F0EFF2;
    padding-top: 2rem;
}

.btn-cancel {
    background: transparent;
    border: 1.5px solid #D0CFDA;
    padding: 0.7rem 1.8rem;
    border-radius: 40px;
    font-weight: 600;
    color: #4B4B5C;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    gap: 8px;
}

.btn-cancel:hover {
    background: #F4F2F9;
    border-color: #B9B7C6;
    transform: translateY(-1px);
}

.btn-register {
    background: linear-gradient(105deg, #C41E3A 0%, #A8152E 100%);
    border: none;
    padding: 0.7rem 2rem;
    border-radius: 40px;
    font-weight: 700;
    color: white;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 8px rgba(196, 30, 58, 0.25);
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 8px;
}

.btn-register:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px -5px rgba(196, 30, 58, 0.4);
    background: linear-gradient(105deg, #B31B34 0%, #961227 100%);
}

/* error styles */
.input-error {
    border-color: #E53E3E !important;
    background-color: #FFF8F8 !important;
}

.val-err {
    font-size: 0.7rem;
    color: #E53E3E;
    margin-top: 5px;
    display: flex;
    align-items: center;
    gap: 4px;
}

/* modern modal */
.modern-modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: all 0.2s;
}

.modal-card {
    background: white;
    border-radius: 40px;
    padding: 2rem 2rem 1.8rem;
    text-align: center;
    width: 320px;
    box-shadow: 0 30px 40px rgba(0, 0, 0, 0.2);
    animation: fadeUp 0.25s ease;
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.spinner-red {
    width: 48px;
    height: 48px;
    border: 4px solid #FFCDCD;
    border-top: 4px solid #C41E3A;
    border-radius: 50%;
    margin: 0 auto 1rem;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.modal-card h3 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
}

.modal-cancel {
    background: #F0F0F5;
    border: none;
    margin-top: 1.2rem;
    padding: 0.5rem 1.2rem;
    border-radius: 40px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
}

.modal-cancel:hover {
    background: #E4E4EC;
}

.hidden {
    display: none;
}

@media (max-width: 480px) {
    .donor-main {
        padding: 1rem;
    }
    .form-inner {
        padding: 1.2rem;
    }
    .btn-register, .btn-cancel {
        padding: 0.6rem 1.2rem;
    }
    .back-dashboard-btn span {
        display: none;
    }
    .back-dashboard-btn i {
        margin: 0;
    }
    .back-dashboard-btn {
        padding: 0.5rem 1rem;
    }
}
</style>
</head>
<body>

<div class="donor-main">
    <!-- Header with Back to Dashboard button -->
    <div class="header-card">
        <div class="header-left">
            <button id="topBackDashboardBtn" class="back-dashboard-btn">
                <i class="fas fa-arrow-left"></i> <span>Back to Dashboard</span>
            </button>
            <div>
                <h1><i class="fas fa-hand-holding-heart" style="color:#C41E3A; margin-right:8px;"></i> Donor Registration</h1>
                <p>Join our life-saving community • Give hope, save lives</p>
            </div>
        </div>
        <div class="donor-badge">
            <span>Welcome, Donor!</span>
            <div class="avatar-icon">
                <i class="fas fa-user-friends"></i>
            </div>
        </div>
    </div>

    <!-- Main Form Card (NO SIDEBAR) -->
    <div class="form-card">
        <div class="form-inner" id="donorFormContainer">
            <!-- Personal Information -->
            <div class="section-header">
                <div class="section-icon"><i class="fas fa-user-circle"></i></div>
                <h2>Personal Information</h2>
            </div>
            <div class="form-grid">
                <div class="input-group"><label>First Name <span class="required-star">*</span></label><input name="first_name" placeholder="e.g., Rajesh"></div>
                <div class="input-group"><label>Last Name <span class="required-star">*</span></label><input name="last_name" placeholder="e.g., Thapa"></div>
                <div class="input-group"><label>Email <span class="required-star">*</span></label><input type="email" name="email" placeholder="donor@example.com"></div>
                <div class="input-group"><label>Phone <span class="required-star">*</span></label><input type="tel" name="phone_number" placeholder="98xxxxxxxx"></div>
                <div class="input-group"><label>Date of Birth <span class="required-star">*</span></label><input type="date" name="date_of_birth" id="dob"></div>
                <div class="input-group"><label>Gender <span class="required-star">*</span></label><select name="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div>
                <div class="input-group"><label>Blood Type <span class="required-star">*</span></label><select name="blood_type"><option value="">Select</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>O+</option><option>O-</option><option>AB+</option><option>AB-</option></select></div>
                <div class="full-width input-group"><label>Street Address <span class="required-star">*</span></label><input name="address" placeholder="House number, street, area"></div>
                <div class="input-group"><label>District <span class="required-star">*</span></label><input name="district" placeholder="e.g., Kathmandu"></div>
                <div class="input-group"><label>State / Province <span class="required-star">*</span></label><input name="state" placeholder="Province No. 3"></div>
                <div class="input-group"><label>Zip Code <span class="required-star">*</span></label><input name="zip_code" placeholder="44600"></div>
            </div>

            <!-- Emergency Contact -->
            <div class="section-header" style="margin-top: 2rem;">
                <div class="section-icon"><i class="fas fa-phone-alt"></i></div>
                <h2>Emergency Contact</h2>
            </div>
            <div class="form-grid">
                <div class="input-group"><label>Contact Name <span class="required-star">*</span></label><input name="emergency_contact_name" placeholder="Full name"></div>
                <div class="input-group"><label>Contact Phone <span class="required-star">*</span></label><input name="emergency_contact_phone" placeholder="98xxxxxxxx"></div>
            </div>

            <!-- Medical Information -->
            <div class="section-header" style="margin-top: 2rem;">
                <div class="section-icon"><i class="fas fa-stethoscope"></i></div>
                <h2>Medical Information</h2>
            </div>
            <div class="form-grid">
                <div class="input-group"><label>Weight (KG) <span class="required-star">*</span></label><input type="number" name="weight" id="weight" placeholder="Minimum 50 kg"></div>
                <div class="full-width">
                    <label style="margin-bottom: 0.6rem; display:block;">Medical Conditions (optional)</label>
                    <div class="conditions-grid">
                        <label class="condition-check"><input type="checkbox" name="has_diabetes"> Diabetes</label>
                        <label class="condition-check"><input type="checkbox" name="has_hypertension"> Hypertension</label>
                        <label class="condition-check"><input type="checkbox" name="has_heart_disease"> Heart Disease</label>
                        <label class="condition-check"><input type="checkbox" name="no_medical_conditions"> No Medical Conditions</label>
                    </div>
                </div>
            </div>

            <!-- Document Uploads -->
            <div class="section-header" style="margin-top: 1rem;">
                <div class="section-icon"><i class="fas fa-id-card"></i></div>
                <h2>Documents & Photo</h2>
            </div>
            <div class="form-grid">
                <div class="file-zone">
                    <div class="file-label"><i class="fas fa-file-alt"></i> Citizenship *</div>
                    <input type="file" name="citizenship_id" id="citizenship" style="margin-top: 8px; font-size: 0.8rem;">
                    <img id="citizenshipPreview" class="preview-img hidden" style="display:none;">
                </div>
                <div class="file-zone">
                    <div class="file-label"><i class="fas fa-camera"></i> Profile Photo *</div>
                    <input type="file" name="photo" id="photo" style="margin-top: 8px;">
                    <img id="photoPreview" class="preview-img hidden" style="display:none;">
                </div>
            </div>

            <!-- Consent + Terms -->
            <div class="consent-block">
                <label><input type="checkbox" name="consent_notifications"> <i class="fas fa-bell"></i> Receive notifications about donation camps & updates</label>
            </div>
            <div class="consent-block">
                <label><input type="checkbox" name="accepted_terms" id="terms"> <i class="fas fa-file-signature"></i> I agree to the <strong>terms & conditions</strong> and confirm that all information is accurate <span class="required-star">*</span></label>
            </div>

            <!-- Buttons -->
            <div class="action-buttons">
                <button type="button" id="cancelFormBtn" class="btn-cancel"><i class="fas fa-times"></i> Cancel</button>
                <button type="button" id="registerBtn" class="btn-register"><i class="fas fa-heartbeat"></i> Register as Donor</button>
            </div>
        </div>
    </div>
</div>

<!-- MODAL (approval waiting) -->
<div id="approvalWaiting" class="hidden modern-modal" style="display: none;">
    <div class="modal-card">
        <div class="spinner-red"></div>
        <h3>Waiting for Approval</h3>
        <p style="color:#5e5e72; margin: 0.5rem 0;">Admin will verify your registration shortly.</p>
        <button id="cancelWaitingBtn" class="modal-cancel">Cancel</button>
    </div>
</div>

<script>
/* ========== NAVIGATION HELPERS ========== */
function goToDashboard() {
    // Clear any polling intervals and timeouts
    if (approvalInterval) clearInterval(approvalInterval);
    if (redirectTimeout) clearTimeout(redirectTimeout);
    window.location.href = "dashboard.html";
}

// Attach back navigation to both buttons
document.getElementById("topBackDashboardBtn").addEventListener("click", goToDashboard);
document.getElementById("cancelFormBtn").addEventListener("click", goToDashboard);

/* ---------- IMAGE PREVIEW (preserve) ---------- */
function previewFile(input, imgEl) {
    if (!input) return;
    input.addEventListener("change", () => {
        const file = input.files[0];
        if (!file) { imgEl.classList.add("hidden"); imgEl.style.display = "none"; return; }
        const reader = new FileReader();
        reader.onload = e => {
            imgEl.src = e.target.result;
            imgEl.classList.remove("hidden");
            imgEl.style.display = "block";
        };
        reader.readAsDataURL(file);
    });
}
const citizenshipInput = document.getElementById("citizenship");
const photoInput = document.getElementById("photo");
const citizenshipPreview = document.getElementById("citizenshipPreview");
const photoPreview = document.getElementById("photoPreview");
if (citizenshipInput && citizenshipPreview) previewFile(citizenshipInput, citizenshipPreview);
if (photoInput && photoPreview) previewFile(photoInput, photoPreview);

/* ----- Live validation clear ----- */
function attachLiveValidation() {
    document.querySelectorAll("#donorFormContainer input:not([type=checkbox]):not([type=file]), #donorFormContainer select").forEach(el => {
        el.addEventListener("input", () => removeErrorStyle(el));
        el.addEventListener("change", () => removeErrorStyle(el));
    });
    const termsChk = document.getElementById("terms");
    if(termsChk) termsChk.addEventListener("change", () => removeCheckboxError(termsChk));
    document.getElementById("citizenship")?.addEventListener("change", () => clearFileError("citizenship"));
    document.getElementById("photo")?.addEventListener("change", () => clearFileError("photo"));
}
function removeErrorStyle(el) {
    el.classList.remove("input-error");
    const parent = el.parentElement;
    const errSpan = parent?.querySelector(".val-err");
    if(errSpan) errSpan.remove();
}
function removeCheckboxError(checkbox) {
    const container = checkbox.closest(".consent-block");
    const err = container?.querySelector(".val-err");
    if(err) err.remove();
}
function clearFileError(inputId) {
    const inp = document.getElementById(inputId);
    const parent = inp?.parentElement;
    const errSpan = parent?.querySelector(".val-err");
    if(errSpan) errSpan.remove();
}
function showFieldError(el, msg) {
    removeErrorStyle(el);
    el.classList.add("input-error");
    const errDiv = document.createElement("div");
    errDiv.className = "val-err";
    errDiv.innerHTML = `<i class="fas fa-exclamation-circle" style="font-size:10px;"></i> ${msg}`;
    el.parentElement.appendChild(errDiv);
}
function showFileError(inputEl, msg) {
    const parent = inputEl.parentElement;
    const oldErr = parent.querySelector(".val-err");
    if(oldErr) oldErr.remove();
    if(!msg) return;
    const errDiv = document.createElement("div");
    errDiv.className = "val-err";
    errDiv.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${msg}`;
    parent.appendChild(errDiv);
}
function showCheckboxError(checkboxEl, msg) {
    const container = checkboxEl.closest(".consent-block");
    const old = container?.querySelector(".val-err");
    if(old) old.remove();
    if(!msg) return;
    const errDiv = document.createElement("div");
    errDiv.className = "val-err";
    errDiv.style.marginTop = "8px";
    errDiv.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${msg}`;
    container?.appendChild(errDiv);
}
/* ----- Core Validation (same logic, modernized UI feedback) ----- */
function validateDonorForm() {
    let valid = true;
    const getField = (name) => document.querySelector(`[name="${name}"]`);
    const firstName = getField("first_name");
    if(!firstName.value.trim()) { showFieldError(firstName,"First name is required."); valid=false; }
    else if(!/^[A-Za-z\s'.]{2,}$/.test(firstName.value.trim())) { showFieldError(firstName,"Use letters only."); valid=false; }
    const lastName = getField("last_name");
    if(!lastName.value.trim()) { showFieldError(lastName,"Last name required."); valid=false; }
    else if(!/^[A-Za-z\s'.]{1,}$/.test(lastName.value.trim())) { showFieldError(lastName,"Letters only."); valid=false; }
    const email = getField("email");
    if(!email.value.trim()) { showFieldError(email,"Email required."); valid=false; }
    else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())) { showFieldError(email,"Valid email required."); valid=false; }
    const phone = getField("phone_number");
    if(!phone.value.trim()) { showFieldError(phone,"Phone required."); valid=false; }
    else if(!/^(97|98)\d{8}$/.test(phone.value.trim())) { showFieldError(phone,"Nepal mobile (97/98 + 8 digits)."); valid=false; }
    const dobEl = document.getElementById("dob");
    if(!dobEl.value) { showFieldError(dobEl,"Date of birth required."); valid=false; }
    else {
        const dob = new Date(dobEl.value);
        const today = new Date();
        let age = today.getFullYear() - dob.getFullYear();
        if(today < new Date(dob.getFullYear(), dob.getMonth(), dob.getDate())) age--;
        if(dob >= today) { showFieldError(dobEl,"Must be in past."); valid=false; }
        else if(age<18) { showFieldError(dobEl,"Must be at least 18."); valid=false; }
        else if(age>65) { showFieldError(dobEl,"Max age 65."); valid=false; }
    }
    const gender = getField("gender");
    if(!gender.value) { showFieldError(gender,"Select gender."); valid=false; }
    const blood = getField("blood_type");
    if(!blood.value) { showFieldError(blood,"Select blood type."); valid=false; }
    const addr = getField("address");
    if(!addr.value.trim() || addr.value.trim().length<5) { showFieldError(addr,"Complete address required."); valid=false; }
    const district = getField("district");
    if(!district.value.trim()) { showFieldError(district,"District required."); valid=false; }
    const state = getField("state");
    if(!state.value.trim()) { showFieldError(state,"State required."); valid=false; }
    const zip = getField("zip_code");
    if(!zip.value.trim()) { showFieldError(zip,"Zip required."); valid=false; }
    else if(!/^\d{5}$/.test(zip.value.trim())) { showFieldError(zip,"5-digit zip code."); valid=false; }
    const ecName = getField("emergency_contact_name");
    if(!ecName.value.trim()) { showFieldError(ecName,"Emergency contact required."); valid=false; }
    else if(!/^[A-Za-z\s'.]{2,}$/.test(ecName.value.trim())) { showFieldError(ecName,"Valid name required."); valid=false; }
    const ecPhone = getField("emergency_contact_phone");
    if(!ecPhone.value.trim()) { showFieldError(ecPhone,"Emergency phone required."); valid=false; }
    else if(!/^(97|98)\d{8}$/.test(ecPhone.value.trim())) { showFieldError(ecPhone,"Valid 10-digit mobile."); valid=false; }
    const weight = document.getElementById("weight");
    const wVal = parseInt(weight.value);
    if(!weight.value) { showFieldError(weight,"Weight required."); valid=false; }
    else if(isNaN(wVal) || wVal<50) { showFieldError(weight,"Minimum 50 kg to donate."); valid=false; }
    else if(wVal>200) { showFieldError(weight,"Max 200 kg."); valid=false; }
    const citizenshipFile = document.getElementById("citizenship");
    if(!citizenshipFile.files[0]) { showFileError(citizenshipFile,"Citizenship required."); valid=false; }
    else if(citizenshipFile.files[0].size > 5*1024*1024) { showFileError(citizenshipFile,"Max 5MB."); valid=false; }
    const photoFile = document.getElementById("photo");
    if(!photoFile.files[0]) { showFileError(photoFile,"Photo required."); valid=false; }
    else if(photoFile.files[0].size > 5*1024*1024) { showFileError(photoFile,"Photo max 5MB."); valid=false; }
    const terms = document.getElementById("terms");
    if(!terms.checked) { showCheckboxError(terms,"You must accept terms."); valid=false; }
    return valid;
}
/* ---------- GLOBALS ---------- */
let approvalInterval = null;
let redirectTimeout = null;
let isSubmitting = false;
/* ---------- REGISTER ---------- */
document.getElementById("registerBtn").addEventListener("click", async (e) => {
    e.preventDefault();
    if(isSubmitting) return;
    if(!validateDonorForm()){
        const firstErr = document.querySelector(".val-err");
        if(firstErr) firstErr.scrollIntoView({ behavior: "smooth", block: "center" });
        return;
    }
    isSubmitting = true;
    const formData = new FormData();
    let location = null;
    if(navigator.geolocation){
        try {
            const pos = await new Promise((res,rej)=> navigator.geolocation.getCurrentPosition(res, rej, {timeout:8000}));
            location = { latitude: pos.coords.latitude, longitude: pos.coords.longitude };
        } catch(e){ console.warn("location disabled"); }
    }
    if(location){
        formData.append("latitude", location.latitude);
        formData.append("longitude", location.longitude);
    }
    document.querySelectorAll("#donorFormContainer input, #donorFormContainer select").forEach(el => {
        if(!el.name) return;
        if(el.type === "checkbox" && el.checked) formData.append(el.name, "on");
        else if(el.type === "file" && el.files[0]) formData.append(el.name, el.files[0]);
        else if(el.type !== "checkbox") formData.append(el.name, el.value);
    });
    sessionStorage.setItem("donor_waiting", "true");
    showWaitingPopup();
    startApprovalCheck();
    try {
        await fetch("http://localhost:8000/donor/register/", {
            method: "POST",
            headers: { "Authorization": `Bearer ${localStorage.getItem("access_token")}` },
            body: formData
        });
    } catch(err){ console.warn("submission err", err); }
    finally { isSubmitting = false; }
});
function showWaitingPopup(){
    const modal = document.getElementById("approvalWaiting");
    modal.classList.remove("hidden");
    modal.style.display = "flex";
    if(redirectTimeout) clearTimeout(redirectTimeout);
    redirectTimeout = setTimeout(goToDashboard, 5000);
}
document.getElementById("cancelWaitingBtn").addEventListener("click", () => {
    if(redirectTimeout) clearTimeout(redirectTimeout);
    sessionStorage.removeItem("donor_waiting");
    goToDashboard();
});
function startApprovalCheck(){
    if(approvalInterval) clearInterval(approvalInterval);
    const emailInput = document.querySelector("input[name='email']");
    const email = emailInput ? emailInput.value : "";
    approvalInterval = setInterval(async () => {
        try {
            const res = await fetch("http://localhost:8000/donor/check-approval/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email })
            });
            if(!res.ok) return;
            const data = await res.json();
            if(data.approved || data.already_approved){
                clearInterval(approvalInterval);
                clearTimeout(redirectTimeout);
                sessionStorage.removeItem("donor_waiting");
                window.location.href = "index.html";
            }
        } catch(err){ console.warn("poll err", err); }
    }, 5000);
}
window.addEventListener("DOMContentLoaded", () => {
    attachLiveValidation();
    const fullname = localStorage.getItem("fullname");
    const emailStored = localStorage.getItem("emailaddress");
    if(fullname){
        const parts = fullname.split(" ");
        const fname = document.querySelector("input[name='first_name']");
        const lname = document.querySelector("input[name='last_name']");
        if(fname) fname.value = parts[0] || "";
        if(lname) lname.value = parts.slice(1).join(" ") || "";
    }
    if(emailStored){
        const emailInp = document.querySelector("input[name='email']");
        if(emailInp) { emailInp.value = emailStored; emailInp.readOnly = true; }
    }
    if(sessionStorage.getItem("donor_waiting") === "true"){
        showWaitingPopup();
        startApprovalCheck();
    }
});
