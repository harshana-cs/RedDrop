<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - RedDrop</title>

<link href="../../dist/output.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>

<body class="bg-gray-50">
<div class="min-h-screen flex">

<!-- ================= SIDEBAR (UNCHANGED) ================= -->
<aside class="w-64 bg-white border-r border-gray-200 shadow-sm">
    <div class="p-6">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-gradient-to-r from-purple-500 to-purple-600 rounded-lg flex items-center justify-center">
                <i class="fas fa-tint text-white"></i>
            </div>
            <div>
                <h2 class="text-xl font-bold text-gray-900">BloodLink Admin</h2>
                <p class="text-xs text-gray-500">Management System</p>
            </div>
        </div>
    </div>
</aside>

<!-- ================= MAIN ================= -->
<main class="flex-1 p-6 overflow-y-auto">

<div class="bg-white rounded-lg shadow-sm border border-gray-200 mb-6">
<div class="border-b border-gray-200">
<nav class="flex space-x-8 px-6">
    <button data-tab="overview" class="py-4 px-1 border-b-2 border-purple-500 text-purple-600">Overview</button>
    <button data-tab="blood" class="py-4 px-1 border-b-2 border-transparent text-gray-500">Pending Requests</button>
    <button data-tab="donor" class="py-4 px-1 border-b-2 border-transparent text-gray-500">Pending Donations</button>
</nav>
</div>

<div class="p-6">

<!-- ================= OVERVIEW ================= -->
<div id="overviewSection" class="space-y-6">
    <h3 class="text-lg font-medium text-gray-900">Dashboard Overview</h3>
</div>

<!-- ================= BLOOD REQUESTS ================= -->
<div id="pendingBloodRequests" class="hidden mt-6">
<h3 class="text-lg font-medium text-gray-900 mb-4">Pending Blood Requests</h3>

<table class="min-w-full bg-white border border-gray-200 rounded-lg">
<thead class="bg-gray-100">
<tr>
    <th class="px-4 py-3 text-left">Patient</th>
    <th class="px-4 py-3 text-left">Blood</th>
    <th class="px-4 py-3 text-left">Hospital</th>
    <th class="px-4 py-3 text-left">Urgency</th>
    <th class="px-4 py-3 text-left">Documents</th>
    <th class="px-4 py-3 text-left">Date</th>
    <th class="px-4 py-3 text-center">Action</th>
</tr>
</thead>
<tbody id="bloodRequestsBody" class="divide-y divide-gray-200">
<tr><td colspan="6" class="px-4 py-3 text-gray-500">Click tab to load data</td></tr>
<td class="px-4 py-3 text-center space-x-2">
    <button 
        class="bg-green-500 text-white px-2 py-1 rounded approve-blood"
        data-id="${r.id}">
        Approve
    </button>
    <button 
        class="bg-red-500 text-white px-2 py-1 rounded reject-blood"
        data-id="${r.id}">
        Reject
    </button>
</td>

</tbody>
</table>
</div>

<!-- ================= DONOR REQUESTS ================= -->
<div id="pendingDonorRequests" class="hidden mt-6">
<h3 class="text-lg font-medium text-gray-900 mb-4">Pending Donor Registrations</h3>

<table class="min-w-full bg-white border border-gray-200 rounded-lg">
<thead class="bg-gray-100">
<tr>
    <th class="px-4 py-3 text-left">Donor</th>
    <th class="px-4 py-3 text-left">Blood</th>
    <th class="px-4 py-3 text-left">Contact</th>
    <th class="px-4 py-3 text-left">Documents</th>
    <th class="px-4 py-3 text-left">Date</th>

    <th class="px-4 py-3 text-center">Action</th>
</tr>
</thead>
<tbody id="donorRequestsBody" class="divide-y divide-gray-200">
    <tr>
        <td colspan="5" class="px-4 py-3 text-gray-500 text-center">
            Click tab to load data
        </td>
    </tr>
</tbody>

</table>
</div>

</div>
</div>
</main>
</div>

<!-- ================= JS ================= -->
<script>
lucide.createIcons();

/* ---------- TAB SWITCH ---------- */
const tabs = document.querySelectorAll('nav button');
const overview = document.getElementById('overviewSection');
const blood = document.getElementById('pendingBloodRequests');
const donor = document.getElementById('pendingDonorRequests');

tabs.forEach(tab => {
    tab.addEventListener('click', () => {

        tabs.forEach(t => {
            t.classList.remove('border-purple-500','text-purple-600');
            t.classList.add('border-transparent','text-gray-500');
        });

        tab.classList.add('border-purple-500','text-purple-600');

        overview.style.display = 'none';
        blood.style.display = 'none';
        donor.style.display = 'none';

        if(tab.dataset.tab === 'overview') overview.style.display = 'block';
        if(tab.dataset.tab === 'blood') { blood.style.display = 'block'; loadBloodRequests(); }
        if(tab.dataset.tab === 'donor') { donor.style.display = 'block'; loadDonors(); }
    });
});

/* ---------- FETCH BLOOD REQUESTS ---------- */
async function loadBloodRequests() {
    const body = document.getElementById('bloodRequestsBody');
    body.innerHTML = "<tr><td colspan='6'>Loading...</td></tr>";

    try {
        const res = await fetch('http://127.0.0.1:8000/api/admin/pending-blood-requests/');
        const json = await res.json();
        body.innerHTML = "";

        json.data.forEach(r => {
            body.innerHTML += `
            <tr>
                <td class="px-4 py-3">${r.patient_name}</td>
                <td class="px-4 py-3">${r.blood_type}</td>
                <td class="px-4 py-3">${r.hospital}</td>
                <td class="px-4 py-3 text-red-600">${r.urgency}</td>
                <td class="px-4 py-3 space-x-2">
                    ${r.hospital_doc ? `<a href="${r.hospital_doc}" target="_blank" class="text-blue-600 underline">Hospital Doc</a>` : '-'}
                    ${r.doctor_note ? `<a href="${r.doctor_note}" target="_blank" class="text-blue-600 underline">Doctor Note</a>` : ''}
                </td>
                <td class="px-4 py-3">${r.date || '-'}</td>
<td class="px-4 py-3 text-center relative">
    <button onclick="toggleMenu('blood-${r.id}')"
        class="bg-gray-200 px-3 py-1 rounded">
        Action ▾
    </button>

    <div id="blood-${r.id}"
        class="hidden absolute right-0 mt-2 w-32 bg-white border rounded shadow z-10">
        <button onclick="approveBloodRequest(${r.id})"
            class="block w-full text-left px-4 py-2 hover:bg-green-100 text-green-600">
            Approve
        </button>
        <button onclick="rejectBloodRequest(${r.id})"
            class="block w-full text-left px-4 py-2 hover:bg-red-100 text-red-600">
            Reject
        </button>
    </div>
</td>

            </tr>`;
        });
    } catch {
        body.innerHTML = "<tr><td colspan='6' class='text-red-600'>Failed to load data</td></tr>";
    }
}

/* ---------- FETCH DONORS ---------- */
async function loadDonors() {
    const body = document.getElementById('donorRequestsBody');
    body.innerHTML = "<tr><td colspan='5'>Loading...</td></tr>";

    try {
        const res = await fetch(
  "http://127.0.0.1:8000/api/admin/pending-donor-registrations/",
  { credentials: "include" }
);

        const json = await res.json();
        body.innerHTML = "";

        json.data.forEach(d => {
            body.innerHTML += `
            <tr>
                <td class="px-4 py-3">${d.name}</td>
                <td class="px-4 py-3">${d.blood_type || '-'}</td>
                <td class="px-4 py-3">${d.phone || '-'}</td>
                <td class="px-4 py-3 space-x-2">
                    ${d.citizenship_id 
                        ? `<a href="http://127.0.0.1:8000${d.citizenship_id}" target="_blank" class="text-blue-600 underline">ID</a>` 
                        : 'No ID'}
                    ${d.photo 
                        ? `<a href="http://127.0.0.1:8000${d.photo}" target="_blank" class="text-blue-600 underline ml-2">Photo</a>` 
                        : ''}
                </td>
                <td class="px-4 py-3">${d.created_on || '-'}</td>
<td class="px-4 py-3 text-center relative">
    <button onclick="toggleMenu('donor-${d.id}')"
        class="bg-gray-200 px-3 py-1 rounded">
        Action ▾
    </button>

    <div id="donor-${d.id}"
        class="hidden absolute right-0 mt-2 w-32 bg-white border rounded shadow z-10">
        <button onclick="approveDonor(${d.id})"
            class="block w-full text-left px-4 py-2 hover:bg-green-100 text-green-600">
            Approve
        </button>
        <button onclick="rejectDonor(${d.id})"
            class="block w-full text-left px-4 py-2 hover:bg-red-100 text-red-600">
            Reject
        </button>
    </div>
</td>


            </tr>`;
        });
    } catch {
        body.innerHTML = "<tr><td colspan='5' class='text-red-600'>Failed to load data</td></tr>";
    }
}
async function approveBloodRequest(id) {
    if (!confirm("Approve this blood request?")) return;

    await fetch(`http://127.0.0.1:8000/api/admin/blood-request/${id}/approve/`, {
        method: "POST"
    });

    loadBloodRequests();
}

async function rejectBloodRequest(id) {
    if (!confirm("Reject this blood request?")) return;

    await fetch(`http://127.0.0.1:8000/api/admin/blood-request/${id}/reject/`, {
        method: "POST"
    });

    loadBloodRequests();
}
async function approveDonor(id) {
    if (!confirm("Approve this donor?")) return;

    await fetch(`http://127.0.0.1:8000/api/admin/donor/${id}/approve/`, {
        method: "POST"
    });

    loadDonors();
}

async function rejectDonor(id) {
    if (!confirm("Reject this donor?")) return;

    await fetch(`http://127.0.0.1:8000/api/admin/donor/${id}/reject/`, {
        method: "POST"
    });

    loadDonors();
}
function toggleMenu(id) {
    document.querySelectorAll('[id^="blood-"], [id^="donor-"]').forEach(menu => {
        if (menu.id !== id) menu.classList.add("hidden");
    });

    document.getElementById(id).classList.toggle("hidden");
}

</script>

</body>
</html>
